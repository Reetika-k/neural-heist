# Build the game and publish it on GitHub Pages: https://reetika-k.github.io/neural-heist/
# Runs on every push to main (and by hand from the Actions tab). The unit tests must pass first.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags too: the submitted version is rebuilt from tag v1.0-submission
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # VITE_LLM_URL is optional: set it as a repository variable once the Cloudflare Worker is deployed.
      # Without it the hacking assistant reasons offline over the emails the player's index retrieved.
      - run: npm run build
        env:
          VITE_LLM_URL: ${{ vars.VITE_LLM_URL }}
      # Which version the main link shows is the repository variable LIVE_VERSION (2026-11-04):
      #   v1 (default, while the capstone is evaluated): the submitted version at /neural-heist/, the newest at /neural-heist/v2/
      #   v2 (after grading):                           the newest at /neural-heist/
      # The submitted version is always also at /neural-heist/v1/. It is rebuilt from tag v1.0-submission on every deploy,
      # so it cannot drift from what was submitted.
      - name: Build the submitted version (tag v1.0-submission)
        run: |
          git worktree add ../v1 v1.0-submission
          cd ../v1 && npm ci && npm run build
        env:
          VITE_LLM_URL: ${{ vars.VITE_LLM_URL }}
      - name: Arrange the site
        run: |
          mv dist ../newest
          if [ "${LIVE_VERSION:-v1}" = "v2" ]; then
            cp -R ../newest dist
          else
            cp -R ../v1/dist dist
            cp -R ../newest dist/v2
            mkdir -p dist/demo && cp ../newest/demo/neural-heist-walkthrough-v2.mp4 dist/demo/ # keep the version-2 video link working
          fi
          cp -R ../v1/dist dist/v1
          ls dist
        env:
          LIVE_VERSION: ${{ vars.LIVE_VERSION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
