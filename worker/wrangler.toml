name = "neural-heist-llm"
main = "llm-proxy.js"
compatibility_date = "2026-10-01"

[vars]
# Only the live game may call the Worker (GitHub Pages origin; no path). For Cloudflare Pages use "https://<project>.pages.dev".
ALLOWED_ORIGIN = "https://reetika-k.github.io"
# 2026-10-24: gemini-2.0-flash was shut down by Google (the API answered 404).
# GEMINI_MODEL = "gemini-2.0-flash"
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Secrets (never in this file):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GROQ_API_KEY      (optional backup)
